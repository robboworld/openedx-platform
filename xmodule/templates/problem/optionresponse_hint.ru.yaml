    markdown: |
        You can use this template as a guide to the simple editor markdown and OLX markup to use for dropdown with hints and feedback problems. Отредактируйте компонент и замените текст своим заданием.
        >>Добавьте текст вопроса или условие. Это поле обязательно.||При необходимости добавьте подсказку или примечание к условию. <<
        [[
        неверный ответ {{You can specify optional feedback like this, which appears after this answer is submitted.}}
        (верный ответ)
        неверный ответ {{You can specify optional feedback for none, a subset, or all of the answers.}}
        ]]


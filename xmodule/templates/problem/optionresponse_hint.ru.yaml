hinted: true
data:   |
        <problem>
            <optionresponse>
                <p>You can use this template as a guide to the simple editor markdown and OLX markup to use for dropdown with hints and feedback problems. Отредактируйте компонент и замените текст своим заданием.</p>
                <label>Добавьте текст вопроса или условие. Это поле обязательно.</label>
                <description>При необходимости добавьте подсказку или примечание к условию. </description>
                <optioninput>
                    <option correct="False">неверный ответ <optionhint>You can specify optional feedback like this, which appears after this answer is submitted.</optionhint></option>
                    <option correct="True">верный ответ</option>
                    <option correct="False">неверный ответ <optionhint>You can specify optional feedback for none, a subset, or all of the answers.</optionhint></option>
                </optioninput>
            </optionresponse>
            <demandhint>
              <hint>You can add an optional hint like this. Problems that have a hint include a hint button, and this text appears the first time learners select the button.</hint>
              <hint>If you add more than one hint, a different hint appears each time learners select the hint button.</hint>
            </demandhint>
        </problem>

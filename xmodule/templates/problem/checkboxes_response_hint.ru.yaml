---
metadata:
    display_name: Флажки с подсказками и обратной связью
    markdown: |

      You can use this template as a guide to the simple editor markdown and OLX markup to use for checkboxes with hints and feedback problems. Отредактируйте компонент и замените текст своим заданием.

      >>Добавьте текст вопроса или условие. Это поле обязательно.||При необходимости добавьте подсказку или примечание к условию.<<

      [x] верный ответ {{ selected: You can specify optional feedback that appears after the learner selects and submits this answer. }, { unselected: You can specify optional feedback that appears after the learner clears and submits this answer.}}
      [ ] неверный ответ
      [ ] неверный ответ {{ selected: You can specify optional feedback for none, all, or a subset of the answers. }, { unselected: You can specify optional feedback for selected answers, cleared answers, or both.}}
      [x] верный ответ


      {{ ((A B D)) You can specify optional feedback for a combination of answers which appears after the specified set of answers is submitted. }}
      {{ ((A B C D)) You can specify optional feedback for one, several, or all answer combinations. }}

      ||You can add an optional hint like this. Problems that have a hint include a hint button, and this text appears the first time learners select the button.||
      ||If you add more than one hint, a different hint appears each time learners select the hint button.||


hinted: true
data:   |
        <problem>
            <choiceresponse>
                <p>You can use this template as a guide to the simple editor markdown and OLX markup to use for checkboxes with hints and feedback problems. Отредактируйте компонент и замените текст своим заданием.</p>
                <label>Добавьте текст вопроса или условие. Это поле обязательно.</label>
                <description>При необходимости добавьте подсказку или примечание к условию.</description>
                <checkboxgroup>
                    <choice correct="true">верный ответ
                        <choicehint selected="true">You can specify optional feedback that appears after the learner selects and submits this answer.</choicehint>
                        <choicehint selected="false">You can specify optional feedback that appears after the learner clears and submits this answer.</choicehint>
                    </choice>
                    <choice correct="false">неверный ответ
                    </choice>
                    <choice correct="false">неверный ответ
                        <choicehint selected="true">You can specify optional feedback for none, all, or a subset of the answers.</choicehint>
                        <choicehint selected="false">You can specify optional feedback for selected answers, cleared answers, or both.</choicehint>
                    </choice>
                    <choice correct="true">верный ответ
                    </choice>
                    <compoundhint value="A B D">You can specify optional feedback for a combination of answers which appears after the specified set of answers is submitted.</compoundhint>
                    <compoundhint value="A B C D">You can specify optional feedback for one, several, or all answer combinations.</compoundhint>
                </checkboxgroup>
            </choiceresponse>

            <demandhint>
                <hint>You can add an optional hint like this. Problems that have a hint include a hint button, and this text appears the first time learners select the button.</hint>
                <hint>If you add more than one hint, a different hint appears each time learners select the hint button.</hint>
            </demandhint>
        </problem>

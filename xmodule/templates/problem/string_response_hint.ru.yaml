---
metadata:
    display_name: Текстовый ввод с подсказками и обратной связью
    markdown: |

        You can use this template as a guide to the simple editor markdown and OLX markup to use for text input with hints and feedback problems. Отредактируйте компонент и замените текст своим заданием.

        >>Добавьте текст вопроса или условие. Это поле обязательно.||При необходимости добавьте подсказку или примечание к условию. <<

        = верный ответ {{You can specify optional feedback like this, which appears after this answer is submitted.}}
        or= optional acceptable variant of верный ответ
        not= optional incorrect answer such as a frequent misconception  {{You can specify optional feedback for none, a subset, or all of the answers.}}

        ||You can add an optional hint like this. Problems that have a hint include a hint button, and this text appears the first time learners select the button.||
        ||If you add more than one hint, a different hint appears each time learners select the hint button.||

hinted: true
data:   |
        <problem>
            <stringresponse answer="верный ответ" type="ci">
                <p>You can use this template as a guide to the simple editor markdown and OLX markup to use for text input with hints and feedback problems. Отредактируйте компонент и замените текст своим заданием.</p>
                <label>Добавьте текст вопроса или условие. Это поле обязательно.</label>
                <description>При необходимости добавьте подсказку или примечание к условию.</description>
                <correcthint>You can specify optional feedback like this, which appears after this answer is submitted.</correcthint>
                <additional_answer answer="optional acceptable variant of верный ответ"/>
                <stringequalhint answer="optional incorrect answer such as a frequent misconception">You can specify optional feedback for none, a subset, or all of the answers.</stringequalhint>
                <textline size="20"/>
            </stringresponse>
            <demandhint>
                <hint>You can add an optional hint like this. Problems that have a hint include a hint button, and this text appears the first time learners select the button.</hint>
                <hint>If you add more than one hint, a different hint appears each time learners select the hint button.</hint>
            </demandhint>
        </problem>

metadata:
    display_name: Инструмент IFrame
data: |
      <h3 class="hd hd-2">IFrame Tool</h3>
      <p>Инструмент IFrame встраивает упражнение или сервис с другого сайта в содержимое курса. В примере ниже студенты могут изучать, как форма треугольника влияет на связанную с ним линию.</p>
      <p>Задания в IFrame не оцениваются. Для оцениваемых упражнений используйте Custom JavaScript Problem.</p>
      <p>Ниже — HTML-формат для IFrame. Замените значения, выделенные <i>курсивом</i>.</p>
        <pre>
        &lt;iframe title="<i>Обязательный заголовок инструмента</i>"
          src="<i>URL инструмента, начинающийся с https://</i>"&gt;
           <i>Сообщение, если браузер не поддерживает IFrame.</i>
        &lt;/iframe&gt;
        </pre>
      <p>The Iframe below includes the width, height, marginwidth, marginheight, frameborder, and scrolling attributes. These attributes are optional. You can remove these attributes or replace their values.</p>
      <p>При необходимости измените этот шаблон.</p>
      <p>Чтобы изменить IFrame, отредактируйте исходный HTML. В редакторе нажмите <strong>HTML</strong> на панели инструментов.</p>
      <p>Then modify the example below for your own use.
      <ol>
      <li>Replace the value of the <strong>src</strong> attribute of the IFrame with the URL of the tool that you want in your course.
      <p><strong>Note</strong>: The URL must start with <strong>https</strong> instead of http, to ensure that the tool appears in all browsers that support IFrames.</p></li>
      <li>Replace the value of the <strong>title</strong> attribute with the title of the tool. You <strong>must</strong> include the title to provide an accessible label.</li>
      <li>Replace other IFrame attributes as needed. See <a href="http://www.w3.org/wiki/HTML/Elements/iframe" target="_blank">the IFrame specification</a> for more information.</li>
      <li>Optionally, replace the text between the opening and closing <strong>iframe</strong> tags.
          <pre>Ваш браузер не поддерживает IFrame.</pre>
          <p>A learner sees this text if the browser does not support IFrames.</p>
      </li>
      </ol>
      <p>The sample IFrame follows. Modify its attributes as described above.</p>
      <iframe title="Euler Line Demo" src="https://studio.edx.org/c4x/edX/DemoX/asset/eulerLineDemo.html" width="402" height="402" marginwidth="0" marginheight="0" frameborder="0" scrolling="no">
      Ваш браузер не поддерживает IFrame.
      </iframe>

    display_name: Текст в LaTeX
    source_code: |
        \subsection{Пример текста в LaTeX}

        Здесь можно писать сложные формулы на LaTeX.

        \begin{equation}
                x = \frac{-b\pm\sqrt{b^2-4*a*c}}{2a}
        \end{equation}

data: |
    <html>
        <h3 class="hd hd-2">Пример: страница текста</h3>
        <p>Здесь можно писать сложные формулы на LaTeX.</p>
        <p>When you add the component, be sure to select <strong>Settings</strong> 
        to specify a <strong>Display Name</strong> and other values that apply.</p>
        <p>When editing this component, select <strong>Открыть компилятор LaTeX</strong> to edit equations.</p>
        <p>Then, in the equation editor, select <strong>Сохранить и скомпилировать в XML</strong> to see the equation in the component.</p>
    </html>
